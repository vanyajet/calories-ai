name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/shared/**
      - package-lock.json
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

concurrency: deploy-server

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace @calories/server --include-workspace-root=false
      - run: npm run typecheck --workspace @calories/server

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}
            git pull --ff-only
            cd apps/server
            docker compose up -d --build api
            docker image prune -f
            sleep 3
            HOST_PORT=$(grep -E '^HOST_PORT=' .env | cut -d= -f2 || true)
            curl -fsS "http://localhost:${HOST_PORT:-8787}/health"
