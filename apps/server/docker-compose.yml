services:
  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports:
      - "8787:8787"

  # HTTPS via Let's Encrypt. Needs a domain whose A record points at this server
  # and ports 80/443 open. Start with: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  caddy_data:
